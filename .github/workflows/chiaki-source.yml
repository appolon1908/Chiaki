name: Chiaki owned launcher source validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  chiaki-source:
    name: chiaki-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate only the owned launcher; deny unvetted application additions
        run: |
          bash -n docs/scripts/nabeel-chiaki-launch.sh
          python -m unittest discover -s tests -p 'test_*.py'
          python - <<'PYTHON'
          import subprocess
          allowed = {'.github/workflows/nabeel-integration-ci.yml', '.github/workflows/chiaki-source.yml', 'docs/scripts/nabeel-chiaki-launch.sh', 'tests/test_launcher.py', 'governance/interim-release-policy.json'}
          entries = subprocess.check_output(['git','ls-files','--stage','-z']).decode().split('\0')
          for entry in filter(None, entries):
              metadata, path = entry.split('\t', 1)
              mode, _, stage = metadata.split()
              assert stage == '0'
              assert path.endswith('.md') or path in allowed, 'Unvetted product/configuration source: ' + path
              assert mode == ('100755' if path == 'docs/scripts/nabeel-chiaki-launch.sh' else '100644'), 'Unexpected executable/symlink/submodule: ' + path
          PYTHON
      - name: Scan complete effective tree and tracked history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact=100 --exit-code 1 .
